site_name: antcrew docs
site_url: https://docs.antcrew.org
site_description: Documentation for antcrew — the AI agent orchestration platform for teams
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How it works:
    - "Components & architecture": architecture/overview.md
    - "Architecture decisions": architecture/decisions.md
    - "A full team in action": guides/fullstack-team.md
    - "Run lifecycle & events": architecture/data-flow.md
    - Security: architecture/security.md
  - Engine SDK:
    - Overview: engine/index.md
    - "Typed artifacts": engine/contracts.md
    - "LLM providers": engine/providers.md
    - "TraceLog & Replay": engine/tracelog.md
    - "Event payload schema": engine/event-schema.md
    - "Custom capabilities": engine/custom-agents.md
  - Platform:
    - Overview: platform/index.md
    - "Quick start": platform/getting-started.md
    - "Workspaces & API keys": platform/workspaces.md
    - "CLI & API integration": platform/cli-integration.md
    - "Runs & tickets": platform/runs.md
    - "Model configuration": platform/model-config.md
    - "HITL reviews": platform/hitl.md
    - "GitHub App": platform/github-app.md
    - Webhooks: platform/webhooks.md
    - Evals: platform/evals.md
    - "Data retention": platform/data-retention.md
  - Proxy:
    - Overview: proxy/index.md
    - Configuration: proxy/configuration.md
    - "Provider routing": proxy/routing.md
  - Releases:
    - "Week of 11 Aug 2026": releases/2026-w33.md
    - "Week of 4 Aug 2026": releases/2026-w32.md
