site_name: antcrew docs
site_url: https://docs.antcrew.org
site_description: Documentation for antcrew — the AI agent orchestration platform for teams
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

repo_url: https://github.com/iagop03/antcrew-platform
repo_name: antcrew-platform

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How it works:
    - "Components & architecture": architecture/overview.md
    - "A full team in action": guides/fullstack-team.md
    - "Run lifecycle & events": architecture/data-flow.md
    - Security: architecture/security.md
  - Engine SDK:
    - Overview: engine/index.md
    - "Typed contracts": engine/contracts.md
    - "LLM providers": engine/providers.md
    - "TraceLog & Replay": engine/tracelog.md
    - "Custom agents": engine/custom-agents.md
  - Platform:
    - Overview: platform/index.md
    - "Quick start": platform/getting-started.md
    - "Workspaces & API keys": platform/workspaces.md
    - "CLI & API integration": platform/cli-integration.md
    - "Runs & tickets": platform/runs.md
    - "HITL reviews": platform/hitl.md
    - Webhooks: platform/webhooks.md
    - Evals: platform/evals.md
  - Proxy:
    - Overview: proxy/index.md
    - Configuration: proxy/configuration.md
    - "Provider routing": proxy/routing.md
  - Self-hosting: platform/deployment.md
